name: smart_attendance
description: QR-based attendance app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.2
  firebase_storage: ^12.1.1

  # QR & Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.6

  # Location (optional)
  geolocator: ^10.1.0

  # State Management
  provider: ^6.1.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Date formatting
  intl: ^0.19.0

  # Calendar view for faculty session history
  table_calendar: ^3.0.9

  # Local notifications (PIN alert to Faculty)
  flutter_local_notifications: ^17.2.1

  # CSV export for attendance reports
  csv: ^6.0.0

  # File share for reports
  share_plus: ^10.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
